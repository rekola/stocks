name: Linux x86-64

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libunistring-dev \
            libcairo2-dev libfontconfig1-dev libgtk-4-dev libcurl4-openssl-dev xvfb xdotool \
            libmariadb-dev mariadb-server

      # The market-data tests that need a server (the store and the API over it) run against a MariaDB of the runner's own.
      - name: Start MariaDB for the market-data tests
        run: |
          sudo systemctl start mariadb
          sudo mariadb -e "CREATE USER 'market_test'@'localhost' IDENTIFIED BY 'market_test'; GRANT ALL ON \`market\\_test\\_%\`.* TO 'market_test'@'localhost'; GRANT ALL ON \`stocks\\_test\\_%\`.* TO 'market_test'@'localhost';"

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        env:
          MARKET_TEST_DB_USER: market_test
          MARKET_TEST_DB_PASSWORD: market_test
        run: ctest --test-dir build --output-on-failure

      # The benchmarks and their smoke tests again with the standard library's range checks on, as the MSYS2 libstdc++ has
      # them: an out-of-range read that happens to hit valid memory elsewhere aborts here, where it is quick to see.
      - name: Configure (range checks)
        run: cmake -B build-checked -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS"

      - name: Build the benchmarks (range checks)
        run: cmake --build build-checked -j"$(nproc)" --target stocks_period_bench stocks_frame_bench

      - name: Test the benchmarks (range checks)
        run: ctest --test-dir build-checked --output-on-failure -R bench
