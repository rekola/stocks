name: Windows x86-64

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # MSYS2 UCRT64 (MinGW-w64 GCC), as synth builds it; canvas draws with
  # GDI+ here, and the Win32 window backend is compiled.
  build-and-test:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-libunistring
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gdb
            git

      - name: Configure
        run: cmake -G Ninja -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Where a test crashed, the place it crashed at.
      - name: Backtrace of a crash
        if: failure()
        run: |
          for t in stocks_period_bench stocks_frame_bench; do
            echo "== $t"; gdb -batch -ex run -ex bt --args build/$t.exe 30 || true
          done
