name: macOS ARM64

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Apple clang with Homebrew's libunistring; canvas draws with Quartz 2D
  # here. GTK is Linux only.
  build-and-test:
    runs-on: macos-15

    # Clang does not search /opt/homebrew on its own.
    env:
      CPATH: /opt/homebrew/include
      LIBRARY_PATH: /opt/homebrew/lib

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja pkg-config libunistring

      - name: Configure
        run: cmake -G Ninja -B build

      # -k 0: report every compile error in one run, not just the first.
      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure
